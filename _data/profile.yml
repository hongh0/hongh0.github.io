short_bio: >-
  <p>
    I'm currently a Ph.D. student in <a href="https://delta-lab-ai.github.io/" target="_blank">DeLTA Lab</a> at Simon Fraser University, advised by Prof. <a href="https://scholar.google.com/citations?user=RHOcEtsAAAAJ&hl=en" target="_blank">Wuyang Chen</a>. Previously, I worked closely with IEEE Fellow <a href="https://scholar.google.com/citations?hl=zh-CN&user=vAIECxgAAAAJ" target="_blank">Prof. Yefeng Zheng</a>, and I received my B.S. with honors in Computer Science from Shandong University in 2024.
  </p>
  <p>
    My research interests include: <strong>3D Vision</strong> (3D reconstruction and 4D generation, visual generation of 4D physical world); <strong>Physics-Informed Computer Vision</strong> (learning 3D or video models integrated with physics knowledge and numerical simulation).
  </p>
  <p>
    If you have any shared research interests or topics you'd like to chat about, please feel free to <a href="mailto:hhong_@outlook.com">email me</a>. I am always happy to explore potential collaborations and engage in insightful conversations.
  </p>
  <p>
    <strong>Service:</strong> Conference Reviewer: ACMMM 2025, ICCV 2025.
  </p>

